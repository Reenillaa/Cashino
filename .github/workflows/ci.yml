name: CI
on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci
      - name: Edge Functions engine copy is up to date
        run: |
          node scripts/sync-engine.mjs
          git diff --exit-code -- supabase/functions/_shared/engine
      - run: npx expo export --platform web

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Schema behaviour tests (RLS, wallet, idempotency, rewards)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./supabase/tests/run.sh

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check game/index.ts rewards/index.ts account/index.ts poker/index.ts
        working-directory: supabase/functions
