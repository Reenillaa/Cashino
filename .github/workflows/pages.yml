name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the web app under /<repo>
        run: npx expo export --platform web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          # Online backend (Supabase project "Cashino"). The publishable key is PUBLIC by design: it ships
          # inside the web app anyway and only allows what the row-level security policies allow.
          # Never put the secret / service_role key here.
          EXPO_PUBLIC_SUPABASE_URL: https://sdqezhwhkpybeciaonan.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QyImPhthm2wU3lpAE0RIjQ_jhqb3MDz
      - name: Make it an installable PWA (manifest, iOS tags, SPA fallback)
        run: node scripts/pwa-postbuild.mjs /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
