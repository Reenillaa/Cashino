# Supabase CLI configuration (local development + function settings).
project_id = "titanium-app"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[auth]
site_url = "titanium://"
additional_redirect_urls = ["titanium://auth-callback"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_confirmations = true

[functions.game]
verify_jwt = true
[functions.rewards]
verify_jwt = true
[functions.account]
verify_jwt = true
[functions.poker]
verify_jwt = true
[functions.shop]
verify_jwt = true
[functions.live]
verify_jwt = true
[functions.sports]
# 'refresh' is public (throttled, moves no coins); 'bet' checks the user's token itself
verify_jwt = false

[functions.admin]
verify_jwt = true
[functions.push]
# 'tick' is public and idempotent (each notification has a unique key); the rest checks the user's token itself
verify_jwt = false
